name: Build

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install AutoIt toolchain
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          function Install-ChocoPackage {
            param(
              [Parameter(Mandatory = $true)]
              [string[]]$Arguments
            )

            for ($attempt = 1; $attempt -le 3; $attempt++) {
              Write-Host "Chocolatey attempt $attempt/3: choco $($Arguments -join ' ')"
              & choco @Arguments

              if ($LASTEXITCODE -eq 0) {
                return
              }

              if ($attempt -lt 3) {
                Write-Warning "Chocolatey failed with exit code $LASTEXITCODE; retrying in 15 seconds."
                Start-Sleep -Seconds 15
              }
            }

            throw "Chocolatey failed after 3 attempts: choco $($Arguments -join ' ')"
          }

          Install-ChocoPackage @('install', 'autoit.install', '--version=3.3.18', '-y', '--no-progress')
          Install-ChocoPackage @('install', 'scite4autoit3', '-y', '--no-progress')

      - name: Set up Python x86 for acefile
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: 'x86'

      - name: Build executables
        shell: powershell
        run: .\scripts\build.ps1

      - name: Package release
        shell: powershell
        run: .\scripts\package-release.ps1

      - name: Upload per-file bin audit
        uses: actions/upload-artifact@v7
        with:
          name: bin-inventory-${{ github.sha }}
          path: |
            .build/release/BIN-INVENTORY.csv
            .build/release/BIN-EXECUTABLES.csv
            .build/release/BIN-INVENTORY-SUMMARY.txt
          if-no-files-found: error

      - name: Smoke-test packaged build
        shell: powershell
        run: .\scripts\smoke-test.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: UniExtract2-${{ github.sha }}
          path: |
            dist/UniExtract.exe
            dist/UniExtractUpdater.exe
            dist/UniExtractUpdater_NoAdmin.exe
            dist/UniExtract2-v*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && startsWith(github.event.head_commit.message, 'Release ')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version"
          $notes = "docs/releases/v$version.md"
          $assets = @(
            "dist/UniExtract.exe",
            "dist/UniExtractUpdater.exe",
            "dist/UniExtractUpdater_NoAdmin.exe",
            "dist/UniExtract2-v$version.zip",
            "dist/SHA256SUMS.txt"
          )

          $previousErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = 'SilentlyContinue'
          gh release view $tag --repo "${{ github.repository }}" 2>$null | Out-Null
          $releaseExists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = $previousErrorActionPreference

          if ($releaseExists) {
            gh release upload $tag @assets --clobber --repo "${{ github.repository }}"
            gh release edit $tag --title "Universal Extractor 2 v$version" --notes-file $notes --latest --repo "${{ github.repository }}"
          } else {
            gh release create $tag @assets --target "${{ github.sha }}" --title "Universal Extractor 2 v$version" --notes-file $notes --latest --repo "${{ github.repository }}"
          }
